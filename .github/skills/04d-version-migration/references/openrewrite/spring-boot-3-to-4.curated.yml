# 04D-curated OpenRewrite recipe for the Spring Boot 3 -> 4 reference pack.
#
# Data, not a script: 04D's lib/openrewrite.js copies this file into the session's
# transformations/ directory, substitutes the double-brace placeholders with the *requested* target versions
# recorded in baseline.json (validated as plain version strings), and passes it to OpenRewrite with
# -Drewrite.configLocation. It is never copied into the project.
#
# Why a curated composite exists beside the upstream one: the upstream
# org.openrewrite.java.spring.boot4.UpgradeSpringBoot_4_0 pins Boot to 4.0.x (not the requested
# release) and also runs migrations a Boot 3 -> 4 upgrade does not itself require (Testcontainers 2,
# Spring Cloud 2025.1, Spring Batch 6, Kotlin, Gradle wrapper). This list keeps the Boot/Framework/
# Security/test-layer migrations from that composite and pins the platform and language to the
# versions the migration request names.
#
# Recipe names verified against rewrite-spring 6.37.1 (META-INF/rewrite/*.yml and recipes.csv);
# Hibernate, Jackson, Java-version and Maven recipes come from rewrite-spring's declared
# dependencies (rewrite-hibernate, rewrite-jackson, rewrite-migrate-java, rewrite-maven).
---
type: specs.openrewrite.org/v1beta/recipe
name: mars.migration.SpringBoot3To4Curated
displayName: Spring Boot 3 to 4 (04D curated, pinned to the requested target)
description: >-
  The Boot 4 framework migrations from UpgradeSpringBoot_4_0 without its unrelated ecosystem
  upgrades, with the Boot parent and Java level pinned to the migration request.
#
# UpgradeSpringBoot_3_5 is deliberately NOT in this list. It walks the whole Boot 2.x/3.x recipe
# chain, which on a project already on 3.5.x proposes modernisations the jump does not require
# (observed in the recorded E2E preview: @Query -> @NativeQuery, @DependsOnDatabaseInitialization,
# unused-import cleanup). A project that is not on the 3.5.x preparation line previews the pack's
# separate boot35-preparation transformation first.
recipeList:
  - org.openrewrite.java.spring.framework.UpgradeSpringFramework_7_0
  - org.openrewrite.java.spring.security7.UpgradeSpringSecurity_7_0
  - org.openrewrite.java.spring.boot4.SpringBootProperties_4_0
  - org.openrewrite.java.spring.boot4.SpringBootProperties_4_1
  - org.openrewrite.java.spring.boot4.ReplaceMockBeanAndSpyBean
  - org.openrewrite.java.spring.boot4.RelocateWebServerClasses
  - org.openrewrite.hibernate.MigrateToHibernate71
  - org.openrewrite.java.springdoc.UpgradeSpringDoc_3_0
  - org.openrewrite.java.spring.boot4.MigrateJacksonBomProperty
  - org.openrewrite.maven.UpgradeParentVersion:
      groupId: org.springframework.boot
      artifactId: spring-boot-starter-parent
      newVersion: {{target_platform_version}}
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: org.springframework.boot
      artifactId: "*"
      newVersion: {{target_platform_version}}
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: org.springframework.boot
      artifactId: spring-boot-dependencies
      newVersion: {{target_platform_version}}
  - org.openrewrite.java.spring.boot4.MigrateToModularStarters
  - org.openrewrite.java.spring.boot4.RenameDeprecatedStartersManagedVersions
  - org.openrewrite.java.migrate.UpgradeJavaVersion:
      version: {{target_language}}
