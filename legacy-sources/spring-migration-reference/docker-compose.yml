version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: migration-demo-postgres
    environment:
      POSTGRES_DB: employee_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MIGRATION-DEMO: Application container (commented out for manual testing)
  # Uncomment after building the Docker image: mvn clean package -DskipTests docker:build
  # application:
  #   build: .
  #   container_name: migration-demo-app
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     DB_URL: jdbc:postgresql://postgres:5432/employee_db
  #     DB_USERNAME: postgres
  #     DB_PASSWORD: postgres
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

volumes:
  postgres_data:
